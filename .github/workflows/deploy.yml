name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Permet de relancer un déploiement à la main depuis l'onglet Actions,
  # sans avoir à pousser un commit (utile après un incident côté hébergeur).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # On n'annule PAS un déploiement en cours : c'est de la production, on la
  # laisse se terminer. Les exécutions en attente entre-temps sont ignorées.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assembler le dossier publié (liste blanche)
        run: node scripts/build-site.js
      - uses: actions/upload-pages-artifact@v3
        with:
          # PAS la racine : elle exposerait .claude/, src/, supabase/,
          # la configuration et les notes de travail.
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@v5
